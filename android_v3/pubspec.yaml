name: check_hall_charge
description: "اپلیکیشن چک شارژ سالن - کاملاً آفلاین"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # خواندن فایل ZIP/XLSX (ساختار ZIP اکسل)
  archive: ^3.6.1

  # انتخاب فایل
  file_picker: ^8.1.2

  # اسکن بارکد با سرعت بالا (ML Kit)
  mobile_scanner: ^5.2.3

  # ذخیره‌سازی وضعیت کالاها
  shared_preferences: ^2.3.2

  # مسیرها و مدیریت فایل
  path_provider: ^2.1.4
  path: ^1.9.0

  # لرزش موبایل هنگام اسکن
  vibration: ^2.0.1

  # تشخیص گفتار برای ورود صوتی بارکد
  speech_to_text: ^7.0.0

  # پخش صدای واقعی تایید/رد بارکد
  audioplayers: ^6.1.0

  # مدیریت state
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
